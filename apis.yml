name: Bank Jago
description: >-
  PT Bank Jago Tbk is a technology-based digital bank in Indonesia, listed on the
  Indonesia Stock Exchange (IDX: ARTO) and backed by investors including Ribbit
  Capital and GoTo. Rather than a branch network, Bank Jago is delivered through
  the life-centric Jago mobile application and is deeply embedded into partner
  ecosystems — Gojek/GoPay for payments, and Bibit/Stockbit for investing — via
  API-based integrations. Its Open API payment surface is exposed through
  Indonesia's national SNAP (Standar Nasional Open API Pembayaran) programme,
  administered through the ASPI developer directory, rather than a self-hosted
  public developer portal. Bank Jago is regulated by the Indonesian Financial
  Services Authority (OJK) and Bank Indonesia. This API Evangelist profile is
  compiled from public sources as a fintech company lead; the bank publishes no
  self-hosted OpenAPI, SDK, or developer documentation at this time.
